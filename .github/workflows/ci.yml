name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  # Mirrors `mix precommit` in check mode: `deps.unlock --check-unused`
  # and `format --check-formatted` instead of the fixing variants.
  lint:
    name: Checks (format, compile, credo, audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: lint-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix deps.audit
      - run: mix hex.audit

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported (mix.exs: elixir ~> 1.18)
          - elixir: "1.18"
            otp: "27"
            coverage: false
          # Latest — also exports coverage for the CRAP check
          - elixir: "1.20"
            otp: "29"
            coverage: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - run: mix test
        if: ${{ !matrix.coverage }}

      - run: mix test --cover --export-coverage default
        if: ${{ matrix.coverage }}

      - run: mix crap
        if: ${{ matrix.coverage }}
