name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  lint:
    name: Checks (format, compile, credo, audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: lint-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix deps.audit
      - run: mix hex.audit

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      # Analyse the library as shipped, without test/support.
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: dialyzer-${{ hashFiles('mix.lock') }}

      # PLTs are restored and saved separately so a failing Dialyzer run
      # still caches them (mix.exs puts them in priv/plts).
      - name: Restore PLT cache
        id: plt_cache
        uses: actions/cache/restore@v6
        with:
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: priv/plts

      - run: mix deps.get

      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT cache
        if: steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          path: priv/plts

      # `github` annotates the PR diff; `dialyxir` keeps the full warning in the log.
      - run: mix dialyzer --format github --format dialyxir

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported (mix.exs: elixir ~> 1.18)
          - elixir: "1.18"
            otp: "27"
            coverage: false
          # Latest — also exports coverage for the CRAP check
          - elixir: "1.20"
            otp: "29"
            coverage: true
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - run: mix test
        if: ${{ !matrix.coverage }}

      - run: mix test --cover --export-coverage default
        if: ${{ matrix.coverage }}

      - run: mix crap
        if: ${{ matrix.coverage }}
