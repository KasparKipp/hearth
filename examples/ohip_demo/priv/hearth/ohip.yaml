components:
  parameters:
    Accept-Language:
      description: Language code
      in: header
      name: Accept-Language
      schema:
        type: string
    authKey:
      description: Bearer token that needs to be passed which is generated post user authentication
      in: header
      name: authorization
      required: true
      schema:
        type: string
    externalData:
      description: Pass this header as true, if payload needs DVM
      in: header
      name: externalData
      schema:
        type: string
    x-app-key:
      description: Client or Partner's Application Key
      in: header
      name: x-app-key
      required: true
      schema:
        pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}$
        type: string
    x-externalsystem:
      description: External system code.
      example: EXTERNALSYSTEMCODE
      in: header
      name: x-externalsystem
      schema:
        maxLength: 40
        type: string
    x-hotelid:
      description: Mandatory parameter to identify the hotel code where the end user is logged in
      in: header
      name: x-hotelid
      required: true
      schema:
        type: string
    x-originating-application:
      description: Customer's Integration Application Id
      in: header
      name: x-originating-application
      schema:
        type: string
    x-request-id:
      description: Request Id of an incoming request
      in: header
      name: x-request-id
      schema:
        pattern: ~*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}
        type: string
  responses:
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '405':
      description: Method not allowed
    '406':
      description: Not acceptable.
    '413':
      description: Request Entity Too Large
    '414':
      description: Request URI Too Large
    '415':
      description: Unsupported Media Type
    '502':
      description: Bad Gateway
    '503':
      description: Service Unavailable
    blk_400:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/blk_exceptionDetailType'
      description: Bad Request
    blk_404:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/blk_exceptionDetailType'
      description: Resource not found
    blk_500:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/blk_exceptionDetailType'
      description: System Error
    evm_400:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/evm_exceptionDetailType'
      description: Bad Request
    evm_404:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/evm_exceptionDetailType'
      description: Resource not found
    evm_500:
