---
openapi: 3.0.3
info:
  contact:
    email: hospitality_apis_ww_grp@oracle.com
  license:
    name: UPL
    url: https://opensource.org/licenses/upl
  termsOfService: https://www.oracle.com/legal/terms.html
  title: OPERA Cloud Block API + OPERA Cloud Sales Event Management API
  version: 26.2.0.0
security:
  - bearerAuth: []
tags:
  - description: The Block External module provides operations for OPERA Cloud to access blocks from an external interfaces. It also offers capability for downloading external blocks into OPERA Cloud.
    name: BlockExternal
  - description: These APIs will allow you to completely create and manage your block in OPERA Cloud - including all related functionalities of a block such as manage Room allocation, Status update, block reservations.You can search for a block, get a Block, update and create new Blocks.
    name: Block
  - description: Block Statistics provide statistical data of blocks that exist in OPERA Cloud.
    name: BlockStats
  - description: The Event APIs will allow you to retrieve, create, manage and delete events and related event functionality such as event resources, catering packages and even event waitlists.
    name: EventManagement
externalDocs:
  description: Find out more about Oracle Hospitality
  url: https://docs.oracle.com/en/industries/hospitality/integration_platforms.html
paths:
  /blk/v1/blocks:
    get:
      deprecated: true
      description: Use this API to retrieve a list of blocks for requested query parameters. A wide range of query parameters is available to support various persona requirements, so it is recommended to include, at least, the hotel block date range, stay date range, and/or number of days as query parameters. You can use more query parameters to narrow your results. This API is not designed to support sync between two systems or initial upload of data. If x-hubid is used as a header, it returns matching data from multiple hotels within the same chain. <p><strong>OperationId:</strong>getBlocks</p> <p>The maximum allowable limit for this API is <strong>200</strong>.</p>
      operationId: getBlocks
      parameters:
        - in: query
          name: hotelId
          required: false
          schema:
            type: string
        - description: Mark this block as recently accessed.
          in: query
          name: markAsRecentlyAccessed
          required: false
          schema:
            type: boolean
        - description: Indicates maximum number of records a Web Service should return.
          in: query
          name: limit
          required: false
          schema:
            maximum: 200
            type: integer
        - description: Index or initial index of the set(page) being requested. If the index goes out of the bounds of the total set count then no data will be returned.
          in: query
          name: offset
          required: false
          schema:
            default: 0
            type: integer
        - description: Hotel code.
          explode: true
          in: query
          name: multipleHotelsSearchHotelIds
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Free form text field for searching block fields
          in: query
          name: superSearch
          required: false
          schema:
            type: string
        - description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          explode: true
          in: query
          name: blockIdList
          required: false
          schema:
            items:
              type: string
            type: array
        - description: A reference to the type of object defined by the UniqueID element.
          explode: true
          in: query
          name: blockIdType
          required: false
          schema:
            items:
              type: string
            type: array
        - description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          explode: true
          in: query
          name: externalReferenceIds
          required: false
          schema:
            items:
              type: string
            type: array
        - description: Used to identify the source of the identifier (e.g., IATA, ABTA).
          explode: true
          in: query
          name: externalSystemCodes
          required: false
          schema:
            items:
              type: string
            type: array
        - description: Block code
          in: query
          name: blockCode
          required: false
          schema:
            type: string
        - description: Block Name
          in: query
          name: blockName
          required: false
          schema:
            type: string
        - description: Block Owner.
          explode: true
          in: query
          name: blockOwner
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Block Status.
          explode: true
          in: query
          name: blockStatus
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Catering Status.
          explode: true
          in: query
          name: cateringStatus
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Mode of reservation (e.g. EML, TEL, FRTDSK ).
          explode: true
          in: query
          name: reservationMethod
          required: false
          schema:
            items:
              maxLength: 20
              type: string
            maxItems: 50
            type: array
        - description: user who created the Block(s).
          in: query
          name: createdByUser
          required: false
          schema:
            type: string
        - description: The ending value of the date range.
          in: query
          name: blockStartEndDate
          required: false
          schema:
            format: date
            type: string
        - description: The starting value of the date range.
          in: query
          name: blockStartStartDate
          required: false
          schema:
            format: date
            type: string
        - description: The ending value of the date range.
          in: query
          name: blockEndEndDate
          required: false
          schema:
            format: date
            type: string
        - description: The starting value of the date range.
          in: query
          name: blockEndStartDate
          required: false
          schema:
            format: date
            type: string
        - description: Date when guests plan to arrive(first night stay date).
          in: query
          name: reservationArrival
          required: false
          schema:
            format: date
            type: string
        - description: Date when guests plan to leave(last stay day date).
          in: query
          name: reservationDeparture
          required: false
          schema:
            format: date
            type: string
        - description: Whether to include shoulder dates when considering stay date.
          in: query
          name: includeShoulderDates
          required: false
          schema:
            type: boolean
        - in: query
          name: stayDate
          required: false
          schema:
            format: date
            type: string
        - description: The ending value of the date range.
          in: query
          name: blockCreatedOnEndDate
          required: false
          schema:
            format: date
            type: string
        - description: The starting value of the date range.
          in: query
          name: blockCreatedOnStartDate
          required: false
          schema:
            format: date
            type: string
        - description: The ending value of the date range.
          in: query
          name: decisionEndDate
          required: false
          schema:
            format: date
            type: string
        - description: The starting value of the date range.
          in: query
          name: decisionStartDate
          required: false
          schema:
            format: date
            type: string
        - description: The ending value of the date range.
          in: query
          name: cutOffEndDate
          required: false
          schema:
            format: date
            type: string
        - description: The starting value of the date range.
          in: query
          name: cutOffStartDate
          required: false
          schema:
            format: date
            type: string
        - description: Simple type for block instructions to be used in requests for fetching blocks. Valid status values are Group, Source, TravelAgent, Contact, Company.
          explode: true
          in: query
          name: category
          required: false
          schema:
            items:
              enum:
                - Group
                - Source
                - Agent
                - Contact
                - Company
                - Account
              type: string
            type: array
            uniqueItems: true
        - description: Attached profile name
          explode: true
          in: query
          name: name
          required: false
          schema:
            items:
              type: string
            type: array
        - description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          in: query
          name: attachedProfileId
          required: false
          schema:
            type: string
        - description: A reference to the type of object defined by the UniqueID element.
          in: query
          name: attachedProfileIdType
          required: false
          schema:
            type: string
        - description: Show Leads in the search result.
          in: query
          name: leads
          required: false
          schema:
            type: boolean
        - description: Show tour series in the search result.
          in: query
          name: tourSeries
          required: false
          schema:
            type: boolean
        - description: Fetch only blocks which are open for pickup, if true. If the value is false, fetch all block statuses.
          in: query
          name: onlyPickupBlocks
          required: false
          schema:
            type: boolean
        - description: Indicates that only Opportunity blocks will be fetched.
          in: query
          name: onlyOpportunities
          required: false
          schema:
            type: boolean
        - description: Indicates that all master blocks will be excluded from the results. (Master Blocks, Master Allocations, Master Tours, and Master Itineraries).
          in: query
          name: excludeMasterBlocks
          required: false
          schema:
            type: boolean
        - description: Rate Plan Code.
          explode: true
          in: query
          name: ratePlanCode
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Tour code for the block.
          in: query
          name: tourCode
          required: false
          schema:
            type: string
        - explode: true
          in: query
          name: attributeName
          required: false
          schema:
            items:
              type: string
            type: array
        - explode: true
          in: query
          name: orderType
          required: false
          schema:
            items:
              enum:
                - Asc
                - Desc
              type: string
            type: array
            uniqueItems: true
        - description: Return only master allocations that are eligible to be the master for the business block to be converted to sub allocation specified in `targetSubAllocationBlockId`.
          in: query
          name: returnEligibleMasterAllocations
          required: false
          schema:
            type: boolean
        - description: The ID of the regular business block that is being converted to sub allocation.
          in: query
          name: targetSubAllocationBlockId
          required: false
          schema:
            type: string
        - description: Return only master tours or master itineraries that are eligible to be the master for the business block being converted to either a sub tour or a sub itinerary.
          in: query
          name: returnEligibleMasterTours
          required: false
          schema:
            type: boolean
        - description: Type for block instructions that can be used in requests for partial operations.
          explode: true
          in: query
          name: fetchInstructions
          required: false
          schema:
            items:
              enum:
                - AccessExclusions
                - Aliases
                - AlternateDates
                - Attachments
                - Block
                - BlockNextStatuses
                - BlockStatusHistory
                - CatNextStatuses
                - CatStatusHistory
                - CentralSalesLeads
                - Comments
                - DateProtect
                - ExternalReferences
                - GenericRateGrid
                - Header
                - Indicators
                - InventoryItems
                - Owners
                - Packages
                - Policies
                - PrimaryOwners
                - PrimaryProfiles
                - PrimaryRates
                - Profiles
                - RateGrid
                - RateProgram
                - Rates
                - Restrictions
                - SellMessages
                - Statistics
                - SummaryStatistics
                - Traces
                - WashSchedules
                - IncludeSubBlocks
              type: string
            type: array
            uniqueItems: true
        - description: Indicates whether to fetch only those room types that have rooms allocated. If this flag is true then only those room types with rooms allocated for the block are fetched. Only applicable to fetch instruction RateGrid.
          in: query
          name: fetchAllocatedRoomTypes
          required: false
          schema:
            type: boolean
        - description: Start Date for the rate grid data. Only applicable to fetch instruction RateGrid.
          in: query
          name: additionalCriteriaStartDate
          required: false
          schema:
            format: date
            type: string
        - description: Number of days to fetch for the rate grid data. Only applicable to fetch instruction RateGrid.
          in: query
          name: numberOfDays
          required: false
          schema:
            type: number
        - description: Defines the number of Adults.
          in: query
          name: adults
          required: false
          schema:
            type: integer
        - description: Defines the number of Children.
          in: query
          name: children
          required: false
          schema:
            type: integer
        - description: Age of a child in years.
          explode: true
          in: query
          name: childAge
          required: false
          schema:
            items:
              type: integer
            type: array
        - description: Number of children classified under the first Age Qualifying Group(Child Bucket#1).
          in: query
          name: bucket1Count
          required: false
          schema:
            type: integer
        - description: Number of children classified under the second Age Qualifying Group(Child Bucket#2).
          in: query
          name: bucket2Count
          required: false
          schema:
            type: integer
        - description: Number of children classified under the third Age Qualifying Group(Child Bucket#3).
          in: query
          name: bucket3Count
          required: false
          schema:
            type: integer
        - description: Number of children classified under the fourth Age Qualifying Group(Child Bucket#4).
          in: query
          name: bucket4Count
          required: false
          schema:
            type: integer
        - description: Number of children classified under the fifth Age Qualifying Group(Child Bucket#5).
          in: query
          name: bucket5Count
          required: false
          schema:
            type: integer
        - description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
          in: query
          name: existingReservationId
          required: false
          schema:
            type: string
        - description: A reference to the type of object defined by the UniqueID element.
          in: query
          name: existingReservationIdType
          required: false
          schema:
            type: string
        - description: Simple type for block allocation used in room rate grid.
          explode: true
          in: query
          name: roomAllocationCriteria
          required: false
          schema:
            items:
              enum:
                - Initial
                - Actual
                - Rates
                - Pickup
                - Contract
                - Available
                - Pickupperc
                - Changes
                - Released
                - Houseavailability
                - SellLimit
                - AvailableSellLimit
                - MasterAllocInitial
                - Allocated
                - SubAllocResv
                - CutoffDate
              type: string
            type: array
            uniqueItems: true
        - description: The Room Types that need to be fetched for the rate room grid data. If these values are not provided, all room types for the block will be fetched.
          explode: true
          in: query
          name: roomType
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Rate Plan to use for fetching rates.
          in: query
          name: additionalCriteriaRatePlanCode
          required: false
          schema:
            type: string
        - description: Curency in which the grid rates should be fetched.
          in: query
          name: currencyCode
          required: false
          schema:
            type: string
        - description: Simple type for block access exclusion/restriction types.
          explode: true
          in: query
          name: accessRestriction
          required: false
          schema:
            items:
              enum:
                - Availability
                - Create
                - Modify
                - Cancel
              type: string
            type: array
            uniqueItems: true
        - description: Filter blocks which are marked as Catering only. Only Catering only blocks are returned when true.
          in: query
          name: cateringOnly
          required: false
          schema:
            type: boolean
        - description: Filter blocks based on market code, If not provided all the blocks will be returned.
          explode: true
          in: query
          name: marketCode
          required: false
          schema:
            items:
              type: string
            maxItems: 40
            type: array
        - description: Filter blocks based on source code, If not provided all the blocks will be returned.
          explode: true
          in: query
          name: sourceCode
          required: false
          schema:
            items:
              type: string
            maxItems: 40
            type: array
        - $ref: '#/components/parameters/authKey'
        - $ref: '#/components/parameters/externalData'
        - $ref: '#/components/parameters/x-app-key'
        - $ref: '#/components/parameters/x-request-id'
        - $ref: '#/components/parameters/x-originating-application'
        - $ref: '#/components/parameters/x-hotelid'
        - $ref: '#/components/parameters/x-externalsystem'
        - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/blockSummaries'
          description: It also contains Success,Warnings and Errors related to this operation.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
                type: string
        '204':
          description: Blocks not found.
        '400':
          $ref: '#/components/responses/blk_400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/blk_404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '413':
          $ref: '#/components/responses/413'
        '414':
          $ref: '#/components/responses/414'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/blk_500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
      summary: Get Blocks
      tags:
        - Block
  /blk/v1/hotels/{hotelId}/blocks/{blockId}:
    get:
      description: Use this API to retrieve a specific block.  You will need to know the blockID in the request; if you don't know it, please go ahead and use getBlocks API first.  The response will include detailed information about the block. <p><strong>OperationId:</strong>getBlock</p>
      operationId: getBlock
      parameters:
        - description: Unique OPERA Block ID which is used to find a Block from OPERA. This ID is a primary identification of a Block in OPERA.
          in: path
          name: blockId
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - description: Hotel Id
          in: path
          name: hotelId
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - description: Mark this block as recently accessed.
          in: query
          name: markAsRecentlyAccessed
          required: false
          schema:
            type: boolean
        - description: Type for block instructions that can be used in requests for partial operations.
          explode: true
          in: query
          name: fetchInstructions
          required: false
          schema:
            items:
              enum:
                - AccessExclusions
                - Aliases
                - AlternateDates
                - Attachments
                - Block
                - BlockNextStatuses
                - BlockStatusHistory
                - CatNextStatuses
                - CatStatusHistory
                - CentralSalesLeads
                - Comments
                - DateProtect
                - ExternalReferences
                - GenericRateGrid
                - Header
                - Indicators
                - InventoryItems
                - Owners
                - Packages
                - Policies
                - PrimaryOwners
                - PrimaryProfiles
                - PrimaryRates
                - Profiles
                - RateGrid
                - RateProgram
                - Rates
                - Restrictions
                - SellMessages
                - Statistics
                - SummaryStatistics
                - Traces
                - WashSchedules
              type: string
            type: array
            uniqueItems: true
        - description: Indicates whether to fetch only those room types that have rooms or rates allocated. If this flag is true then only those room types with rooms or rates allocated for the block are fetched. Only applicable to fetch instruction RateGrid.
          in: query
          name: fetchAllocatedRoomTypes
          required: false
          schema:
            type: boolean
        - description: Start Date for the rate grid data. Only applicable to fetch instruction RateGrid.
          in: query
          name: startDate
          required: false
          schema:
            format: date
            type: string
        - description: Number of days to fetch for the rate grid data. Only applicable to fetch instruction RateGrid. If this query parameter is not provided, the API defaults to returning data for 7 days.
          in: query
          name: numberOfDays
          required: false
          schema:
            type: number
        - description: Simple type for block allocation used in room rate grid.
          explode: true
          in: query
          name: roomAllocationCriteria
          required: false
          schema:
            items:
              enum:
                - Initial
                - Actual
                - Rates
                - Pickup
                - Contract
                - Available
                - Pickupperc
                - Changes
                - Released
                - Houseavailability
                - SellLimit
                - AvailableSellLimit
                - MasterAllocInitial
                - Allocated
                - SubAllocResv
                - CutoffDate
                - ForecastRooms
                - ForecastRates
              type: string
            type: array
            uniqueItems: true
        - description: The Room Types that need to be fetched for the rate room grid data. If these values are not provided, all room types for the block will be fetched.
          explode: true
          in: query
          name: roomTypes
          required: false
          schema:
            items:
              type: string
            maxItems: 4000
            type: array
        - description: Indicates whether to fetch only those room types that have rooms allocated. If this flag is true then only those room types with rooms allocated for the block are fetched. Only applicable to fetch instruction RateGrid.
          in: query
          name: fetchRoomTypesWithInventory
          required: false
          schema:
            default: false
            type: boolean
        - $ref: '#/components/parameters/authKey'
        - $ref: '#/components/parameters/externalData'
        - $ref: '#/components/parameters/x-app-key'
        - $ref: '#/components/parameters/x-request-id'
        - $ref: '#/components/parameters/x-originating-application'
        - $ref: '#/components/parameters/x-hotelid'
        - $ref: '#/components/parameters/x-externalsystem'
        - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/block'
          description: It also contains Success,Warnings and Errors related to this operation.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
                type: string
        '204':
          description: Block not found.
        '400':
          $ref: '#/components/responses/blk_400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/blk_404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '413':
          $ref: '#/components/responses/413'
        '414':
          $ref: '#/components/responses/414'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/blk_500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
      summary: Get a Block By ID
      tags:
        - Block
  /blk/v1/hotels/{hotelId}/blocks/{blockId}/allocationRange:
    get:
      description: Request for updating block allocation for a range of dates. <p><strong>OperationId:</strong>getBlockRangeInfo</p>
      operationId: getBlockRangeInfo
      parameters:
        - description: Block Id
          in: path
          name: blockId
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - description: Hotel Id
          in: path
          name: hotelId
          required: true
          schema:
            maxLength: 2000
            minLength: 1
            type: string
        - description: Indicates if the Allocation objects refer to Generic Room Types (Room Pools).
          in: query
          name: genericRoomType
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/authKey'
        - $ref: '#/components/parameters/externalData'
        - $ref: '#/components/parameters/x-app-key'
        - $ref: '#/components/parameters/x-request-id'
        - $ref: '#/components/parameters/x-originating-application'
        - $ref: '#/components/parameters/x-hotelid'
        - $ref: '#/components/parameters/x-externalsystem'
        - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/blockRangeInfo'
          description: Response type for fetch block information for range operation.
          headers:
            Content-Language:
              description: Audience language
              schema:
                pattern: '[a-zA-Z]{1,8}(-[a-zA-Z0-9]{1,8})*'
                type: string
        '204':
          description: BlockRangeInfo not found.
        '400':
          $ref: '#/components/responses/blk_400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/blk_404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '413':
          $ref: '#/components/responses/413'
        '414':
          $ref: '#/components/responses/414'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/blk_500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
      summary: Get Block Range Information
      tags:
        - Block
