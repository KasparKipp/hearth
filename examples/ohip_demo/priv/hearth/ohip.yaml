        application/json:
          schema:
            $ref: '#/components/schemas/evm_exceptionDetailType'
      description: System Error
  schemas:
    mealPlansType:
      description: Meal plan codes associated with the rate codes.
      items:
        $ref: '#/components/schemas/mealPlanCodeType'
      maxItems: 4000
      type: array
    resSharedGuestListType:
      description: Collection of shared guest reservations.
      items:
        $ref: '#/components/schemas/resSharedGuestInfoType'
      maxItems: 4000
      type: array
    evm_sellMessageConfigType:
      description: 'Only one of the following can hold a value: HotelCode, CROCode or ChainCode'
      properties:
        blockCode:
          description: Block Code to which the sell message is defined.
          maxLength: 20
          minLength: 0
          type: string
        blockId:
          $ref: '#/components/schemas/blockId'
